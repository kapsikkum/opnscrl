name: iOS (unsigned IPA)

# Builds an unsigned .ipa for sideloading (AltStore, Sideloadly, TrollStore re-sign it with your
# own Apple ID). Runs on a macOS runner because Xcode is required; nothing here needs a paid
# Apple Developer account. On a `v*` tag the IPA is attached to the GitHub release of that tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/check-version.mjs
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Generate the Xcode project
        run: npx tauri ios init --ci

      - name: Apply the app icon
        run: |
          # `tauri ios init` generates the Xcode project; regenerate the icons so its asset catalog uses ours.
          npx tauri icon app-icon.png
          ls src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset | head -30
          # Make sure the iOS set is in the catalog even if the CLI only wrote it under src-tauri/icons.
          cp -f src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/ || true

      - name: Disable code signing in the Xcode project
        run: |
          PBX="$(ls src-tauri/gen/apple/*.xcodeproj/project.pbxproj)"
          perl -pi -e 's/buildSettings = \{/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = "";/g' "$PBX"
          grep -c CODE_SIGNING_ALLOWED "$PBX"

      - name: Build (unsigned)
        run: |
          # The Tauri CLI has to run while Xcode builds (its Rust build phase talks to it). Export and
          # signing are expected to fail without an Apple account; the unsigned .app is what we keep.
          npx tauri ios build --ci --export-method debugging || true
          find src-tauri -name '*.app' -maxdepth 8 | head

      - name: Package the IPA
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP="$(find src-tauri /Users/runner/Library/Developer/Xcode -type d -name '*.app' -path '*iphoneos*' 2>/dev/null | head -1)"
          test -n "$APP"
          # Saving to the gallery needs this key; without it iOS stops the app on the first save.
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryAddUsageDescription' "$APP/Info.plist" \
            || { echo "::error::NSPhotoLibraryAddUsageDescription is missing from the app's Info.plist"; exit 1; }
          mkdir -p ipa/Payload out
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../out/opnscrl-$VERSION-ios-unsigned.ipa" Payload)
          (cd out && shasum -a 256 *.ipa | tee SHA256SUMS-ios.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: opnscrl-ipa
          path: out/*

  # Attaches to the release of the tag. android.yml has the same job under the same concurrency
  # group, so the two workflows never create the release at the same moment.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opnscrl-ipa
          path: out

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*
