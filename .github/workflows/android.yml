name: Android (APK)

# Builds the arm64 and x86_64 APKs (one per ABI). They are release-signed when the
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
# repository secrets exist (see "Android signing" in RELEASING.md); otherwise they are debug-signed
# and named as such. On a `v*` tag the APKs are attached to the GitHub release of that tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/check-version.mjs
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install the NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" || true
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-37.0"
          ls "$ANDROID_HOME/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set; building debug-signed APKs."
          fi

      # `tauri android build` runs `npm run build` (typecheck + Vite build) first.
      - name: Build the release APKs
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          npx tauri android build --apk --split-per-abi --target aarch64 --target x86_64

      - name: Build the debug APKs
        if: steps.signing.outputs.signed != 'true'
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npx tauri android build --apk --debug --split-per-abi --target aarch64 --target x86_64

      # opnscrl-<version>-android-arm64.apk and opnscrl-<version>-android-x86_64.apk; debug-signed
      # builds carry "debug" in the name (opnscrl-<version>-android-arm64-debug.apk).
      - name: Collect
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          SUFFIX=""; [ "$SIGNED" = "true" ] || SUFFIX="-debug"
          mkdir -p out
          for abi in arm64 x86_64; do
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -path "*/$abi/*" | head -1)"
            test -n "$APK" || { echo "::error::No APK found for $abi"; exit 1; }
            cp "$APK" "out/opnscrl-$VERSION-android-$abi$SUFFIX.apk"
          done
          (cd out && sha256sum *.apk > SHA256SUMS-android.txt)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: opnscrl-apk
          path: out/*

  # Attaches to the release of the tag. ios.yml has the same job under the same concurrency group,
  # so the two workflows never create the release at the same moment.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opnscrl-apk
          path: out

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*
